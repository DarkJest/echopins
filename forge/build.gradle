plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
}

base { archivesName = "${mod_id}-forge" }

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${mod_version}+mc${minecraft_version}"
}

// Forge and the original NeoForge 1.20.1 line expose the same net.minecraftforge API.
sourceSets.main.java.srcDir rootProject.file('neoforge/src/main/java')

legacyForge {
    enable {
        forgeVersion = project.forge_version
        disableRecompilation = true
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', ''
            logLevel = org.slf4j.event.Level.INFO
        }
        client { client() }
        server { server(); programArgument '--nogui' }
        data { data() }
    }

    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    modRuntimeOnly "maven.modrinth:simple-voice-chat:${voicechat_dev_runtime_forge}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version_range     : minecraft_version_range,
            forge_version_range         : forge_version_range,
            loader_version_range        : loader_version_range,
            voicechat_api_version_range : voicechat_api_version_range,
            mod_id                      : mod_id,
            mod_name                    : mod_name,
            mod_license                 : mod_license,
            mod_version                 : mod_version,
            mod_authors                 : mod_authors,
            mod_description             : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}
