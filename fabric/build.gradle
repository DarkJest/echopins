plugins {
    id 'fabric-loom' version '1.9.2'
}

base { archivesName = "${mod_id}-fabric" }

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${mod_version}+mc${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang mappings on every loader are what lets `common` compile unchanged for each.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Provided at runtime by the Simple Voice Chat mod. A plain Maven artifact, so Loom does not
    // treat it as a mod and does not try to remap it.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

}

// Current Simple Voice Chat Fabric jars were produced by a newer Loom than this multi-loader
// Gradle build can use. Resolving the jar through a plain configuration and copying it to the
// normal mods directory lets Fabric Loader perform its development remap without asking Loom to
// process the artifact itself.
configurations {
    voicechatFabricRuntime
}

dependencies {
    voicechatFabricRuntime "maven.modrinth:simple-voice-chat:${voicechat_dev_runtime_fabric}"
}

tasks.register('prepareVoicechatRuntime', Copy) {
    from configurations.voicechatFabricRuntime
    into layout.projectDirectory.dir('run/mods')
}

loom {
    runs {
        client { client() }
        server { server() }
    }
}

tasks.named('runClient') { dependsOn tasks.named('prepareVoicechatRuntime') }
tasks.named('runServer') { dependsOn tasks.named('prepareVoicechatRuntime') }

processResources {
    var replaceProperties = [
            minecraft_version_range     : fabric_minecraft_version_range,
            fabric_loader_version       : fabric_loader_version,
            voicechat_api_version       : voicechat_api_version,
            mod_id                      : mod_id,
            mod_name                    : mod_name,
            mod_license                 : mod_license,
            mod_version                 : mod_version,
            mod_authors                 : mod_authors,
            mod_description             : mod_description,
            java_version                : java_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') { expand replaceProperties }
}
