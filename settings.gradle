pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'Fabric';    url = 'https://maven.fabricmc.net/' }
    }
}

rootProject.name = 'echopins'

// `common` is not a Gradle subproject: it has no loader and therefore no Minecraft to compile
// against on its own. Every loader project adds its sources directly and uses Mojang mappings.
include 'neoforge'
include 'forge'
include 'fabric'
