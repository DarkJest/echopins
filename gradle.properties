org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Environment
java_version=21

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)

# NeoForge
neo_version=21.1.248
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Fabric
fabric_loader_version=0.19.3
fabric_api_version=0.116.15+1.21.1
fabric_minecraft_version_range=>=1.21.1 <1.21.2

# Simple Voice Chat
# The mod jar ships a second mod id, `voicechat_api`, whose version tracks the published
# `de.maxhenkel.voicechat:voicechat-api` artifact. Depending on it gives users a clear loader
# error instead of a NoClassDefFoundError.
voicechat_api_version=2.6.20
voicechat_api_version_range=[2.6.20,)
voicechat_dev_runtime_neoforge=neoforge-1.21.1-2.6.22
voicechat_dev_runtime_fabric=fabric-1.21.1-2.6.22

# Mod metadata
mod_id=echopins
mod_name=EchoPins
mod_license=MIT
mod_version=1.0.1
mod_group_id=dev.echopins
mod_authors=EchoPins Contributors
mod_description=Leave short voice messages anchored to places in your Minecraft world.
