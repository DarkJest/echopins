// Settings shared by all loader projects. `common` is a plain source directory rather than a
// subproject, because it has no loader and so nothing to compile Minecraft against by itself.
subprojects {
    apply plugin: 'java'

    version = mod_version
    group = mod_group_id

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
        withSourcesJar()
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Simple Voice Chat'
            url = 'https://maven.maxhenkel.de/repository/public'
            content { includeGroup 'de.maxhenkel.voicechat' }
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
    }

    sourceSets {
        // Every loader compiles the shared sources itself. Mojang mappings on every target mean
        // the same source is valid for each.
        main {
            java.srcDir rootProject.file('common/src/main/java')
            resources.srcDir rootProject.file('common/src/main/resources')
        }
        test {
            java.srcDir rootProject.file('common/src/test/java')
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        // All loaders supply SLF4J in game, but the tests run in a plain JVM.
        testImplementation 'org.slf4j:slf4j-api:2.0.9'
        testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = Integer.parseInt(java_version)
        // `this-escape` was added after Java 17, which is the toolchain required by MC 1.20.1.
        options.compilerArgs << '-Xlint:all,-processing,-serial,-deprecation'
    }

    // Minecraft 1.20.1 runs on Java 17. Keep development launches on the same JVM so a local
    // Java 21 installation cannot hide accidental use of newer APIs.
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
        }
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'full'
        }
    }

    // Deterministic archives: no timestamps, stable file order.
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
