modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/DarkJest/echopins/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/DarkJest/echopins"
logoFile="icon.png"
authors="${mod_authors}"
displayTest="MATCH_VERSION"
description='''${mod_description}

EchoPins lets players record a short voice message and anchor it to a block or a
position in the world. Requires Simple Voice Chat on client and server.'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="voicechat_api"
mandatory=true
versionRange="${voicechat_api_version_range}"
ordering="AFTER"
side="BOTH"
