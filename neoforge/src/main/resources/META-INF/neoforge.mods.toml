modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/DarkJest/echopins/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/DarkJest/echopins"
logoFile = "icon.png"
authors = "${mod_authors}"
description = '''${mod_description}

EchoPins lets players record a short voice message and anchor it to a block or a
position in the world. Anyone who is allowed to see the pin can walk up to it later
and play the message back - the author does not have to be online.

Requires Simple Voice Chat. Must be installed on both the client and the server.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Simple Voice Chat ships this mod id from inside its own jar. Depending on it means a
# missing or too-old Simple Voice Chat produces a readable loader error screen instead of
# a NoClassDefFoundError at runtime.
[[dependencies.${mod_id}]]
modId = "voicechat_api"
type = "required"
versionRange = "${voicechat_api_version_range}"
ordering = "AFTER"
side = "BOTH"
