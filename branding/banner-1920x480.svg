<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="480" viewBox="0 0 1920 480">
  <title>EchoPins banner: world-anchored voice messages for Fabric, Forge and NeoForge</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0A1118"/>
      <stop offset="0.55" stop-color="#16202B"/>
      <stop offset="1" stop-color="#0C171D"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2FB6C4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2FB6C4" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ui { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 92px; font-weight: 700; fill: #F5FAFB; letter-spacing: 1px; }
      .tagline { font-size: 34px; fill: #B9CAD0; }
      .pill { font-size: 23px; font-weight: 600; fill: #E9F3F5; }
      .fine { font-size: 20px; fill: #8FA4AB; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1920" height="480" fill="url(#bg)"/>
  <circle cx="255" cy="230" r="360" fill="url(#glow)"/>
  <circle cx="1650" cy="235" r="430" fill="url(#glow)" opacity="0.45"/>

  <g opacity="0.13" fill="none" stroke="#7AD8E1" stroke-width="3">
    <path d="M1360 72 C1430 30 1510 30 1580 72 S1730 114 1800 72"/>
    <path d="M1320 145 C1420 82 1530 82 1630 145 S1810 208 1910 145"/>
    <path d="M1370 408 C1450 352 1540 352 1620 408 S1780 464 1860 408"/>
  </g>

  <image href="logo.svg" x="120" y="46" width="388" height="388"/>

  <g class="ui" transform="translate(570 116)">
    <text class="title" x="0" y="88">EchoPins</text>
    <text class="tagline" x="4" y="146">Leave a message where it matters.</text>

    <g transform="translate(4 190)">
      <rect width="190" height="52" rx="26" fill="#2FB6C4" opacity="0.2" stroke="#2FB6C4"/>
      <circle cx="28" cy="26" r="7" fill="#2FB6C4"/>
      <text class="pill" x="48" y="34">Fabric</text>

      <rect x="208" width="180" height="52" rx="26" fill="#D5654B" opacity="0.16" stroke="#D5654B"/>
      <circle cx="236" cy="26" r="7" fill="#D5654B"/>
      <text class="pill" x="256" y="34">Forge</text>

      <rect x="406" width="218" height="52" rx="26" fill="#E5A03D" opacity="0.16" stroke="#E5A03D"/>
      <circle cx="434" cy="26" r="7" fill="#E5A03D"/>
      <text class="pill" x="454" y="34">NeoForge</text>

      <rect x="642" width="350" height="52" rx="26" fill="#F5FAFB" opacity="0.06" stroke="#4B5D65"/>
      <text class="pill" x="670" y="34">Simple Voice Chat</text>
    </g>
    <text class="fine" x="4" y="292">MINECRAFT 1.20.1  ·  JAVA 17</text>
  </g>

  <rect x="0" y="474" width="1920" height="6" fill="#2FB6C4"/>
  <rect x="1540" y="474" width="380" height="6" fill="#E5A03D"/>
</svg>
