<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>EchoPins UI mockup: the recording indicator</title>
  <defs>
    <style>
      .ui { font-family: 'Segoe UI', sans-serif; }
      .hud { font-size: 17px; fill: #E9F3F5; }
      .hudmuted { font-size: 17px; fill: #9BB0B6; }
      .hudwarn { font-size: 17px; fill: #E5A03D; }
      .tag { font-size: 16px; fill: #7A8E95; letter-spacing: 2px; }
      .note { font-size: 20px; fill: #9BB0B6; font-family: 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#2B2622"/>
  <g opacity="0.55">
    <rect x="0" y="0" width="1280" height="120" fill="#332D28"/>
    <rect x="0" y="120" width="1280" height="120" fill="#2E2823"/>
    <rect x="0" y="240" width="1280" height="120" fill="#37302A"/>
    <rect x="0" y="360" width="1280" height="120" fill="#2C2621"/>
    <rect x="0" y="480" width="1280" height="120" fill="#332C26"/>
    <rect x="0" y="600" width="1280" height="120" fill="#282320"/>
  </g>
  <g opacity="0.30" fill="#1E1A17">
    <rect x="120" y="60" width="120" height="120"/>
    <rect x="900" y="300" width="120" height="120"/>
    <rect x="240" y="420" width="120" height="120"/>
    <rect x="1020" y="60" width="120" height="120"/>
  </g>
  <rect x="0" y="600" width="1280" height="120" fill="#241F1B"/>

  <!-- Chest being described -->
  <g>
    <rect x="520" y="452" width="180" height="150" fill="#7A5326"/>
    <rect x="520" y="452" width="180" height="52" fill="#8C6130"/>
    <rect x="520" y="500" width="180" height="10" fill="#4A3117"/>
    <rect x="596" y="486" width="28" height="34" rx="4" fill="#C9C2B4"/>
    <rect x="520" y="452" width="180" height="150" fill="none" stroke="#3E2A13" stroke-width="6"/>
  </g>

  <g fill="#E8EEF0" opacity="0.85">
    <rect x="632" y="359" width="16" height="2"/>
    <rect x="639" y="352" width="2" height="16"/>
  </g>

  <!-- Recording HUD, matching RecordingHud at 2x GUI scale -->
  <g transform="translate(490 48)">
    <rect x="0" y="0" width="300" height="68" fill="#101418" opacity="0.71"/>
    <rect x="0" y="0" width="300" height="68" fill="none" stroke="#2FB6C4" stroke-width="2"/>

    <!-- record dot -->
    <g fill="#E5484D">
      <rect x="14" y="16" width="12" height="12"/>
      <rect x="16" y="14" width="8" height="16"/>
      <rect x="12" y="18" width="16" height="8"/>
    </g>

    <text class="ui hud" x="36" y="28">Recording</text>
    <text class="ui hudmuted" x="216" y="28">0:07 / 0:30</text>

    <!-- progress bar -->
    <rect x="12" y="42" width="276" height="8" fill="#232B31"/>
    <rect x="12" y="42" width="64" height="8" fill="#2FB6C4"/>

    <text class="ui hudwarn" x="12" y="64">Hold your voice chat key</text>
  </g>

  <text class="ui note" x="640" y="640" text-anchor="middle">Press and hold the EchoPins key. Release to finish.</text>
  <text class="ui tag" x="24" y="700">UI MOCKUP — NOT A GAMEPLAY SCREENSHOT</text>
</svg>
