<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512" role="img" aria-label="Private EchoPin world marker">
  <title>Private EchoPin marker</title>

  <!--
    The private variant. The pin is tinted a deeper blue and carries a padlock badge, so private
    pins are distinguishable by shape as well as by colour - a colour-only difference would be
    invisible to a large share of players.
  -->

  <g fill="#16202B">
    <circle cx="256" cy="200" r="150"/>
    <path d="M 152 292 L 360 292 L 256 452 Z"/>
  </g>

  <g fill="#5B7FA6">
    <circle cx="256" cy="200" r="126"/>
    <path d="M 168 282 L 344 282 L 256 421 Z"/>
  </g>

  <g fill="#F5FAFB" transform="translate(256 200) scale(0.9) translate(-256 -214)">
    <rect x="226" y="122" width="60" height="116" rx="30" ry="30"/>
    <path d="M 186 200 a 70 70 0 0 0 140 0 h -26 a 44 44 0 0 1 -88 0 Z"/>
    <rect x="246" y="262" width="20" height="34"/>
    <rect x="212" y="292" width="88" height="20" rx="10" ry="10"/>
  </g>

  <!-- Padlock badge -->
  <g>
    <circle cx="372" cy="316" r="98" fill="#16202B"/>
    <circle cx="372" cy="316" r="80" fill="#E5A03D"/>
    <path d="M 340 296 v -22 a 32 32 0 0 1 64 0 v 22 h -22 v -22 a 10 10 0 0 0 -20 0 v 22 Z" fill="#16202B"/>
    <rect x="330" y="296" width="84" height="66" rx="10" ry="10" fill="#16202B"/>
  </g>
</svg>
