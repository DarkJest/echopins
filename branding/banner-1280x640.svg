<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>EchoPins square banner: world-anchored voice messages for Fabric and NeoForge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1118"/>
      <stop offset="0.6" stop-color="#16202B"/>
      <stop offset="1" stop-color="#0C171D"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2FB6C4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2FB6C4" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ui { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 96px; font-weight: 700; fill: #F5FAFB; }
      .tagline { font-size: 31px; fill: #B9CAD0; }
      .pill { font-size: 22px; font-weight: 600; fill: #E9F3F5; }
      .fine { font-size: 19px; fill: #8FA4AB; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="275" cy="310" r="430" fill="url(#glow)"/>
  <circle cx="1100" cy="170" r="360" fill="url(#glow)" opacity="0.4"/>

  <g opacity="0.12" fill="none" stroke="#7AD8E1" stroke-width="3">
    <path d="M760 92 C840 28 930 28 1010 92 S1170 156 1250 92"/>
    <path d="M770 550 C860 482 960 482 1050 550 S1210 618 1300 550"/>
  </g>

  <image href="logo.svg" x="72" y="86" width="420" height="420"/>

  <g class="ui" transform="translate(520 130)">
    <text class="title" x="0" y="94">EchoPins</text>
    <text class="tagline" x="4" y="150">Leave a message</text>
    <text class="tagline" x="4" y="190">where it matters.</text>

    <g transform="translate(4 230)">
      <rect width="172" height="50" rx="25" fill="#2FB6C4" opacity="0.2" stroke="#2FB6C4"/>
      <circle cx="26" cy="25" r="7" fill="#2FB6C4"/>
      <text class="pill" x="46" y="33">Fabric</text>

      <rect x="188" width="202" height="50" rx="25" fill="#E5A03D" opacity="0.16" stroke="#E5A03D"/>
      <circle cx="214" cy="25" r="7" fill="#E5A03D"/>
      <text class="pill" x="234" y="33">NeoForge</text>
    </g>

    <rect x="4" y="300" width="340" height="50" rx="25" fill="#F5FAFB" opacity="0.06" stroke="#4B5D65"/>
    <text class="pill" x="32" y="333">Simple Voice Chat</text>
    <text class="fine" x="4" y="404">MINECRAFT 1.21.1  ·  JAVA 21</text>
  </g>

  <rect x="0" y="632" width="1280" height="8" fill="#2FB6C4"/>
  <rect x="970" y="632" width="310" height="8" fill="#E5A03D"/>
</svg>
