name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The NeoForm cache is the expensive part of a cold build: it holds the decompiled and
      # recompiled Minecraft, which takes several minutes to regenerate from scratch.
      - name: Cache NeoForm artifacts
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoform-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: neoform-${{ runner.os }}-

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            fabric/build/test-results/test/**/*.xml
            fabric/build/reports/tests/test/**
            forge/build/test-results/test/**/*.xml
            forge/build/reports/tests/test/**
            neoforge/build/test-results/test/**/*.xml
            neoforge/build/reports/tests/test/**
          retention-days: 14

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: echopins-jar
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
