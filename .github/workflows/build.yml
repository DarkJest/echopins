name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The NeoForm cache is the expensive part of a cold build: it holds the decompiled and
      # recompiled Minecraft, which takes several minutes to regenerate from scratch.
      - name: Cache NeoForm artifacts
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoform-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: neoform-${{ runner.os }}-

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/test/**/*.xml
            build/reports/tests/test/**
          retention-days: 14

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: echopins-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  # GameTests need a headless Minecraft server, which is materially heavier than the unit tests.
  # Kept as a separate job so a failure here is distinguishable from a normal build failure, and
  # so it can be made required separately once it has proven stable in CI.
  gametest:
    name: GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Cache NeoForm artifacts
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoform-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: neoform-${{ runner.os }}-

      - name: Accept the Minecraft EULA for the test server
        run: |
          mkdir -p run/gameTestServer
          echo "eula=true" > run/gameTestServer/eula.txt

      - name: Run GameTests
        run: ./gradlew runGameTestServer --stacktrace

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: run/**/logs/**
          if-no-files-found: ignore
          retention-days: 14
